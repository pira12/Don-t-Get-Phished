# Enterprise / self-controlled deployment: app + Postgres + Redis.
#
# The default (no compose, no DB) file-backed store is simpler and free — use this
# stack when an organization wants to own its data at scale.
#
#   docker compose up --build
#
# The app image builds in server mode (API routes on). Set DATABASE_DRIVER=prisma
# after implementing src/server/prismaRepository.ts to route storage at Postgres;
# until then the app runs against its file store inside the container volume.

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_SECRET=${AUTH_SECRET:-change-me}
      - DATABASE_DRIVER=${DATABASE_DRIVER:-json}
      - DATABASE_URL=postgresql://izd:izd@postgres:5432/izd
      - REDIS_URL=redis://redis:6379
      - DATA_FILE=/data/izd-db.json
    volumes:
      - app_data:/data
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=izd
      - POSTGRES_PASSWORD=izd
      - POSTGRES_DB=izd
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  app_data:
  pg_data:
